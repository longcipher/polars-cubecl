[package]
name = "polars-cubecl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["cpu"]
cpu = ["polars-cubecl-runtime/cpu", "polars-cubecl-testing/cpu"]
cuda = ["polars-cubecl-runtime/cuda", "polars-cubecl-testing/cuda"]
hip = ["polars-cubecl-runtime/hip", "polars-cubecl-testing/hip"]
metal = ["polars-cubecl-runtime/metal", "polars-cubecl-testing/metal"]
metal-native = ["polars-cubecl-runtime/metal-native", "polars-cubecl-testing/metal-native"]
vulkan = ["polars-cubecl-runtime/vulkan", "polars-cubecl-testing/vulkan"]
parquet = ["polars-cubecl-lower/parquet", "polars-lazy/parquet", "polars-lazy/streaming"]

[dependencies]
bytemuck = { workspace = true }
cubecl = { workspace = true }
cubecl-runtime = { workspace = true }
polars-core = { workspace = true }
polars-cubecl-buffer = { workspace = true }
polars-cubecl-kernels = { workspace = true }
polars-cubecl-lower = { workspace = true }
polars-cubecl-runtime = { workspace = true }
polars-error = { workspace = true }
polars-lazy = { workspace = true }
polars-plan = { workspace = true }
polars-utils = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
polars-cubecl-testing = { workspace = true }
polars-io = { workspace = true, features = ["parquet"] }
proptest = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "engine"
harness = false
